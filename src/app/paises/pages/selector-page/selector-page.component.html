<h1 class="mt-5">Selectores Anidados</h1>
<hr />
<form [formGroup]="miFormulario" (ngSubmit)="guardar()">
  <!-- Región -->
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Continente:</label>
      <select class="form-control" formControlName="region">
        <option value="">-- Seleccione Contintente --</option>
        @for (region of regiones; track region) {
          <option [value]="region | lowercase">
            {{ region }}
          </option>
        }
      </select>
    </div>
  </div>

  <!-- Paises -->
  @if (paises.length !== 0) {
    <div class="row mb-3">
      <div class="col">
        <label class="form-label">País:</label>
        <select class="form-control" formControlName="pais">
          <option value="">-- Seleccione Países --</option>
          @for (pais of paises; track pais) {
            <option [value]="pais.alpha3Code">
              {{ pais.name }}
            </option>
          }
        </select>
      </div>
    </div>
  }

  <!-- Fronteras -->
  @if (fronteras.length > 0) {
    <div class="row mb-3">
      <div class="col">
        <label class="form-label">Fronteras:</label>
        <select class="form-control" formControlName="frontera">
          <option value="">-- Seleccione el País fronterizo --</option>
          @for (frontera of fronteras; track frontera) {
            <option
              [value]="frontera.alpha3Code"
              >
              {{ frontera.name }}
            </option>
          }
        </select>
      </div>
    </div>
  }

  @if (cargando) {
    <div class="row">
      <div class="col">
        <div class="alert alert-primary">Cargando...</div>
      </div>
    </div>
  }

  <div class="row">
    <div class="col">
      <button class="btn btn-primary float-end">Seleccionar</button>
    </div>
  </div>
</form>
